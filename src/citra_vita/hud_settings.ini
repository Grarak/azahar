# Razor HUD settings, read by librazorhud from app0: when the gpulive flags load it.
# LIVE=1 enables GPU Live Metrics (without it every call returns INVALID_PERF_MODE).
# The on-screen HUDs stay off; ENABLE=1 is the module switch.
ENABLE = 1
LIVE = 1
GPU_HUD = 0
CPU_HUD = 0
HUD_DISPLAY_FRAMES = 2
HUD_FIRMWARE = 1
